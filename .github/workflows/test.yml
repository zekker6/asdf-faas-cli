name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  asdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install asdf dependencies
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4

      - name: Run plugin add
        run: asdf plugin add asdf-faas-cli https://github.com/zekker6/asdf-faas-cli.git

      - name: Run plugin test
        run: asdf plugin test asdf-faas-cli . --asdf-tool-version latest

      - name: Run install
        run: asdf install asdf-faas-cli latest